name: Melon — Build & Release

# Tag a release (e.g. `git tag v0.3.3 && git push origin v0.3.3`) and this
# workflow:
#   1. Builds Melon for every platform/arch in parallel
#   2. Stages all assets into a DRAFT GitHub Release
#   3. Publishes the draft when every job succeeds
#   4. Cleans up the draft on any failure (no half-published releases)
#
# Manual trigger: Actions → "Melon — Build & Release" → Run workflow, pass
# a `tag` (e.g. v0.3.3) to build & release an existing tag without re-tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (e.g., main, diagrams). Leave empty for the workflow default branch.'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (e.g., 0.3.3). The tag "v<version>" is created if it does not exist.'
        required: true
        type: string
        default: '0.0.0'
      create_tag:
        description: 'Create & push the v<version> tag from the chosen branch before building.'
        required: false
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

permissions: {}

concurrency:
  group: melon-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build ref & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (gives gh a .git dir — some gh paths probe git)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve ref (branch or tag) and ensure tag exists
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.inputs.branch }}"
          VERSION_INPUT="${{ github.event.inputs.version }}"
          CREATE_TAG="${{ github.event.inputs.create_tag }}"

          # Version identity: workflow_dispatch input, else tag push (v0.3.3 → 0.3.3).
          if [ -n "${VERSION_INPUT}" ] && [ "${VERSION_INPUT}" != "0.0.0" ]; then
            VERSION="${VERSION_INPUT#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            CREATE_TAG="false"
          else
            echo "::error::version is required (e.g., 0.3.3) — pass workflow input or push a v* tag"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::invalid version '${VERSION}' (expected semver like 0.3.3)"
            exit 1
          fi
          TAG="v${VERSION}"
          if [ -z "${BRANCH}" ]; then
            # Free from the event context — no gh/git probing needed.
            BRANCH="${{ github.event.repository.default_branch }}"
          fi
          echo "Using branch=${BRANCH} tag=${TAG} version=${VERSION}"

          # Check if release already exists (--repo: never probe local git)
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — refusing to overwrite."
            exit 1
          fi
          
          # Use curl directly to avoid gh CLI internal git dependencies
          API="https://api.github.com/repos/${GH_REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          
          if [ "${CREATE_TAG}" = "true" ]; then
            # Check if tag exists via GitHub API
            TAG_RESP=$(curl -s -w "%{http_code}" -H "${AUTH}" -H "${ACCEPT}" "${API}/git/ref/tags/${TAG}" -o /tmp/tag.json)
            if [ "${TAG_RESP}" = "200" ]; then
              echo "Tag ${TAG} already exists on origin — using it."
            else
              # Get branch HEAD SHA
              SHA=$(curl -s -H "${AUTH}" -H "${ACCEPT}" "${API}/git/ref/heads/${BRANCH}" | jq -r .object.sha)
              echo "Branch ${BRANCH} HEAD = ${SHA}"
              
              # Create tag (lightweight tag via refs endpoint)
              curl -s -X POST -H "${AUTH}" -H "${ACCEPT}" \
                "${API}/git/refs" \
                -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${SHA}\"}" >/dev/null
              echo "Created tag ${TAG} → ${SHA}"
            fi
          else
            # Verify tag exists
            TAG_RESP=$(curl -s -w "%{http_code}" -H "${AUTH}" -H "${ACCEPT}" "${API}/git/ref/tags/${TAG}" -o /dev/null)
            if [ "${TAG_RESP}" != "200" ]; then
              echo "::error::Tag ${TAG} not found on origin and create_tag=false."
              exit 1
            fi
          fi
          
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact_suffix: 'arm64.dmg'
          - os: macos-latest
            arch: x64
            artifact_suffix: 'x64.dmg'
          - os: ubuntu-latest
            arch: x64
            artifact_suffix: 'x64.AppImage'
          - os: windows-latest
            arch: x64
            artifact_suffix: 'x64.exe'
          - os: windows-latest
            arch: arm64
            artifact_suffix: 'arm64.exe'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MELON_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Stamp release version into package.json (Settings + artifact names)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${MELON_VERSION}"
          echo "Stamping version=${VERSION}"
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.MELON_VERSION;
          if (!version) {
            console.error('MELON_VERSION missing');
            process.exit(1);
          }
          for (const p of [
            'desktop/package.json',
            'packages/melon-server/package.json',
            'packages/melon-web/package.json',
          ]) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = version;
            fs.writeFileSync(p, JSON.stringify(j, null, 4) + '\n');
            console.log(`  ${p} → ${version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install system deps (Linux — node-canvas needs cairo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Build pi workspace deps (ai, agent, coding-agent, …)
        run: npm run build

      - name: Build web UI
        run: npm --workspace packages/melon-web run build

      - name: Build server
        run: npm --workspace packages/melon-server run build

      - name: Sync into desktop shell
        shell: bash   # windows runner defaults to pwsh — rm/cp are bash
        run: |
          rm -rf desktop/server desktop/web-dist
          cp -R packages/melon-server/dist desktop/server
          cp -R packages/melon-web/dist desktop/web-dist
          # Keep desktop/package.json version as the product identity the
          # packaged server reads via ../package.json (Settings footer).
          cp packages/melon-server/package.json desktop/server/package.json

      - name: Install desktop deps (electron + electron-builder at pinned versions)
        run: npm ci
        working-directory: desktop

      - name: Build Melon (electron-builder, ${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # no code-signing in CI
        shell: bash   # \ continuations + cd: bash, not pwsh
        run: |
          cd desktop
          npx electron-builder \
            --${{ matrix.os == 'macos-latest' && 'mac' || matrix.os == 'windows-latest' && 'win' || 'linux' }} \
            --${{ matrix.arch }} \
            --publish never

      - name: Verify packaged server runtime deps are inside app.asar
        shell: bash
        run: |
          # electron-builder packages node_modules ONLY from desktop/package.json.
          # A runtime dep added to packages/melon-server but not to desktop ships a
          # DMG that crashes with ERR_MODULE_NOT_FOUND on first launch (diff, 0.3.x).
          # Unpacked dir names differ per OS/arch (mac-arm64, mac, win-unpacked,
          # win-arm64-unpacked, linux-unpacked) — discover the asar, don't hardcode.
          shopt -s nullglob
          asars=(
            desktop/dist/mac*/Melon.app/Contents/Resources/app.asar
            desktop/dist/*unpacked/resources/app.asar
          )
          if [ ${#asars[@]} -eq 0 ]; then
            echo "::error::no packaged app.asar found under desktop/dist"
            exit 1
          fi
          for asar_path in "${asars[@]}"; do
            node --input-type=commonjs -e "
              const asar = require('./desktop/node_modules/@electron/asar');
              const files = asar.listPackage(process.argv[1]).map(String);
              const missing = ['diff', 'fastify', '@earendil-works/pi-coding-agent']
                .filter((d) => !files.includes('/node_modules/' + d + '/package.json'));
              if (missing.length) {
                console.error('MISSING from ' + process.argv[1] + ': ' + missing.join(', '));
                process.exit(1);
              }
              console.log('packaged server deps OK:', process.argv[1]);
            " "$asar_path"
          done

      - name: Verify binary arch matches the job (never ship a wrong-arch build)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # electron-builder names the arm64 bundle dir mac-arm64 and the x64
          # one plain mac. Verify with lipo — a Rosetta-wrong build shipped as
          # Melon-arm64.dmg once and made the whole app laggy (GPU under
          # Rosetta). Fail loudly instead.
          if [ "${{ matrix.arch }}" = "arm64" ]; then DIR=desktop/dist/mac-arm64; WANT=arm64; else DIR=desktop/dist/mac; WANT=x86_64; fi
          GOT="$(lipo -archs "$DIR/Melon.app/Contents/MacOS/Melon")"
          echo "$DIR → $GOT (want $WANT)"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::arch mismatch: binary is $GOT, job builds $WANT"
            exit 1
          fi

      - name: Ad-hoc sign macOS app (unsigned bundles → Gatekeeper checks per launch = lag)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in desktop/dist/mac*/Melon.app; do
            [ -d "$app" ] || continue
            codesign --force --deep --sign - "$app"
            codesign --verify "$app" && echo "✓ ad-hoc signed: $app"
          done

      - name: Locate built artifact
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${MELON_VERSION}"
          OUT="Melon-${VERSION}-${{ matrix.artifact_suffix }}"
          # Arch-aware pick: electron-builder names arm64 mac dmgs with an
          # -arm64 suffix and x64 ones WITHOUT any suffix when artifactName
          # is unset; with Melon-${version}-${arch}.${ext} both include arch.
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            macos-latest-arm64)
              ARTIFACT="$(find desktop/dist -maxdepth 2 -type f -name "*-${VERSION}-arm64.dmg" | head -1)"
              if [ -z "$ARTIFACT" ]; then
                ARTIFACT="$(find desktop/dist -maxdepth 2 -type f -name "*-arm64.dmg" | head -1)"
              fi
              ;;
            macos-latest-x64)
              ARTIFACT="$(find desktop/dist -maxdepth 2 -type f -name "*-${VERSION}-x64.dmg" | head -1)"
              if [ -z "$ARTIFACT" ]; then
                ARTIFACT="$(find desktop/dist -maxdepth 2 -type f -name "*.dmg" ! -name "*-arm64.dmg" | head -1)"
              fi
              ;;
            windows-latest-*)
              ARTIFACT="$(find desktop/dist -maxdepth 2 -type f \( -name "*-${VERSION}-${{ matrix.arch }}.exe" -o -name "*.exe" \) | head -1)" ;;
            ubuntu-latest-*)
              ARTIFACT="$(find desktop/dist -maxdepth 2 -type f \( -name "*-${VERSION}-*.AppImage" -o -name "*.AppImage" \) | head -1)" ;;
          esac
          if [ -z "$ARTIFACT" ]; then
            echo "::error::no artifact produced for arch=${{ matrix.arch }} on ${{ matrix.os }}"
            find desktop/dist -maxdepth 2 -type f || true
            exit 1
          fi
          echo "Found: $ARTIFACT"
          # Canonical release name: Melon-<version>-<arch>.<ext> — matches
          # Settings footer and avoids electron-builder names with spaces
          # ("Melon Setup 0.3.2.exe"). Skip cp when already correctly named:
          # macOS/Git Bash `cp` exits 1 for identical source/dest.
          DEST="desktop/dist/${OUT}"
          if [ "$ARTIFACT" != "$DEST" ]; then
            cp "$ARTIFACT" "$DEST"
          fi
          echo "artifact=${DEST}" >> "$GITHUB_OUTPUT"
          echo "Canonical: ${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: melon-${{ needs.prepare.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.locate.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

  stage-release:
    name: Stage GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Stage assets + SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          # Flatten so the release gets one file per platform/arch.
          find . -type f \
            \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" \) \
            -exec cp {} . \;
          find . -mindepth 1 -type d -empty -delete
          ls -la
          # SHA256SUMS
          shopt -s nullglob
          sha256sum Melon-*.dmg Melon-*.AppImage Melon-*.exe 2>/dev/null > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_VERSION}"
          # If a release with this tag already exists (re-run), delete the draft
          # so we never publish duplicate/partial assets.
          existing="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "${existing}" = "true" ]; then
            gh release delete "${RELEASE_TAG}" --repo "${GH_REPO}" --yes
          fi
          if [ "${existing}" = "false" ]; then
            echo "::error::Release ${RELEASE_TAG} is already published. Bump the tag."
            exit 1
          fi
          # nullglob: unmatched patterns expand to nothing instead of erroring;
          # loop guards against spaces. Never ls-in-subshell — GNU ls exits 2
          # when ANY glob fails, killing the script under set -e before the
          # no-assets guard can run.
          shopt -s nullglob
          ASSETS=()
          for f in Melon-*.dmg Melon-*.AppImage Melon-*.exe SHA256SUMS; do
            ASSETS+=("$f")
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::no release assets found"
            ls -la
            exit 1
          fi
          gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" \
            --verify-tag \
            --draft \
            --title "Melon ${RELEASE_TAG}" \
            --notes "Automated multi-platform build.

          Settings → footer shows \`Melon ${VERSION}\` — same identity as these filenames.

          | Platform | Architecture | Asset |
          |----------|--------------|-------|
          | macOS    | arm64 (Apple Silicon) | Melon-${VERSION}-arm64.dmg |
          | macOS    | x64   (Intel)         | Melon-${VERSION}-x64.dmg |
          | Linux    | x64                    | Melon-${VERSION}-x64.AppImage |
          | Windows  | x64                    | Melon-${VERSION}-x64.exe |
          | Windows  | arm64                  | Melon-${VERSION}-arm64.exe |

          Verify: \`shasum -a 256 -c SHA256SUMS\` after download." \
            "${ASSETS[@]}"

          # Sanity check: every local file appears in the release.
          expected="$(printf '%s\n' "${ASSETS[@]}" | sort)"
          actual="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets --jq '.assets[].name' | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::asset set mismatch"
            diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            exit 1
          fi
          echo "Release ${RELEASE_TAG} staged as draft (assets: ${#ASSETS[@]})"

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, stage-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Publish draft → public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ -z "${existing}" ]; then
            echo "::error::Release ${RELEASE_TAG} not found."
            exit 1
          fi
          if [ "${existing}" = "false" ]; then
            echo "Release ${RELEASE_TAG} is already public."
            exit 0
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
          echo "Released ${RELEASE_TAG}"

  cleanup-on-failure:
    name: Cleanup draft on failure
    needs: [prepare, build, stage-release, publish-release]
    if: ${{ always() && (needs.build.result == 'failure' || needs.stage-release.result == 'failure' || needs.publish-release.result == 'failure' || needs.publish-release.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "${existing}" = "true" ]; then
            gh release delete "${RELEASE_TAG}" --repo "${GH_REPO}" --yes
            echo "Deleted failed draft release ${RELEASE_TAG}"
          fi
